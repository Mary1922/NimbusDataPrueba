name: Actualizar datos AEMET v1

on:
  schedule:
    - cron: "*/30 * * * *"  # cada 30 minutos
  workflow_dispatch:

jobs:
  update-data:
    permissions:
      contents: write
    runs-on: ubuntu-latest

    env:
      AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
      
    steps:
      # 1. Descargar tu código del repositorio
      - name: Descargar proyecto
        uses: actions/checkout@v4

      # 2. Instalar Python
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Instalar dependencias
      - name: Instalar librerías
        run: pip install -r requirements.txt

      # 4. Ejecutar tu programa principal (CORREGIDO)
      - name: Ejecutar ingesta AEMET
        run: |
          export PYTHONPATH=$PYTHONPATH:$(pwd)
          python src/ingestion/auto_update.py

      # 5. Guardar cambios en GitHub
      - name: Guardar datos actualizados
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/
          git commit -m "Actualización automática de datos AEMET" || echo "sin cambios"
          git push