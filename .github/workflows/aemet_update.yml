name: Actualizar datos AEMET v1

on:
  schedule:
    - cron: "/15 * * * *"  # cada 15 minutos
  workflow_dispatch:      # permite ejecutarlo manualmente

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar tu código del repositorio
      - name: Descargar proyecto
        uses: actions/checkout@v3

      # 2. Instalar Python
      - name: Instalar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. Instalar dependencias
      - name: Instalar librerías
        run: pip install -r requirements.txt

      # 4. Ejecutar tu programa principal
      - name: Ejecutar ingesta AEMET
        run: python src/main.py

      # 5. Guardar cambios en GitHub
      - name: Guardar datos actualizados
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add data/
          git commit -m "Actualización automática de datos AEMET" || echo "sin cambios"
          git push